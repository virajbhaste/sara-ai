<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARA AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #132244, #060913 70%);
      color: #eef4ff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(10, 16, 35, 0.9);
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #00e676; }
    .actions { display: flex; gap: 8px; }
    button, select, input {
      font-size: 13px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 11px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(8, 13, 28, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 12px;
      overflow: hidden;
    }
    .orb-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .orb {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #67e8f9, #2563eb 65%, #1e1b4b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: #2563eb; }
    .msg.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.12); }
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px 14px;
      background: rgba(10, 16, 35, 0.95);
    }
    .input-bar input { flex: 1; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 99;
    }
    .modal-bg.show { display: flex; }
    .modal {
      width: 100%;
      max-width: 380px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
    .primary { background: #0284c7; border-color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span><span>SARA AI</span></div>
    <div class="actions">
      <button id="muteBtn" type="button">Mute: OFF</button>
      <button id="setupBtn" type="button" onclick="openSetupBox()">Setup</button>
    </div>
  </header>

  <div class="toolbar">
    <select id="langSelect">
      <option value="mr-IN">मराठी (Marathi)</option>
      <option value="hi-IN">हिन्दी (Hindi)</option>
      <option value="en-IN">English</option>
    </select>
    <button id="handsFreeBtn" type="button">Hands-Free: OFF</button>
    <button id="tutorBtn" type="button">English Tutor: OFF</button>
  </div>

  <main class="main">
    <div class="orb-box">
      <div id="orb" class="orb">✨</div>
      <div id="statusText">Mic dabun bol kiva khali type kar</div>
    </div>
    <div id="chatBox" class="chat">
      <div class="msg ai">Namaskar! Mi SARA AI. Setup madhun Gemini API key tak.</div>
    </div>
  </main>

  <form id="chatForm" class="input-bar">
    <input id="promptInput" type="text" placeholder="SARA la kahi pan vichar..." />
    <button class="primary" type="submit">Send</button>
    <button id="micBtn" type="button">🎤</button>
  </form>

  <div id="setupModal" class="modal-bg">
    <div class="modal">
      <h3>SARA AI Setup</h3>
      <p>Gemini API key ithe taka:</p>
      <input id="apiKeyInput" type="password" placeholder="AIzaSy..." />
      <div class="modal-btns">
        <button id="closeModalBtn" type="button" onclick="closeSetupBox()">Cancel</button>
        <button id="saveKeyBtn" class="primary" type="button" onclick="saveApiKeyBox()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const KEY_NAME = "sara_ai_gemini_key";
    const setupModal = document.getElementById("setupModal");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const muteBtn = document.getElementById("muteBtn");
    const handsFreeBtn = document.getElementById("handsFreeBtn");
    const tutorBtn = document.getElementById("tutorBtn");
    const langSelect = document.getElementById("langSelect");
    const statusText = document.getElementById("statusText");
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const micBtn = document.getElementById("micBtn");

    let muted = false;
    let handsFree = false;
    let tutor = false;

    function openSetupBox() {
      apiKeyInput.value = localStorage.getItem(KEY_NAME) || "";
      setupModal.classList.add("show");
    }

    function closeSetupBox() {
      setupModal.classList.remove("show");
    }

    function saveApiKeyBox() {
      const val = apiKeyInput.value.trim();
      if (val) localStorage.setItem(KEY_NAME, val);
      else localStorage.removeItem(KEY_NAME);
      closeSetupBox();
      statusText.textContent = val ? "API Key save zali!" : "API Key remove keli";
    }

    muteBtn.onclick = () => {
      muted = !muted;
      muteBtn.textContent = muted ? "Mute: ON" : "Mute: OFF";
      if (muted && "speechSynthesis" in window) speechSynthesis.cancel();
    };

    handsFreeBtn.onclick = () => {
      handsFree = !handsFree;
      handsFreeBtn.textContent = handsFree ? "Hands-Free: ON" : "Hands-Free: OFF";
      if (handsFree) startMic();
    };

    tutorBtn.onclick = () => {
      tutor = !tutor;
      tutorBtn.textContent = tutor ? "English Tutor: ON" : "English Tutor: OFF";
    };

    function addMsg(text, type) {
      const d = document.createElement("div");
      d.className = "msg " + type;
      d.textContent = text;
      chatBox.appendChild(d);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speak(text) {
      if (muted || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langSelect.value;
      u.onend = () => { if (handsFree) startMic(); };
      speechSynthesis.speak(u);
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = SR ? new SR() : null;
    if (rec) {
      rec.interimResults = false;
      rec.onstart = () => { statusText.textContent = "Aikat ahe... bol!"; };
      rec.onresult = (e) => {
        const spoken = e.results[0][0].transcript;
        promptInput.value = spoken;
        askGemini(spoken);
      };
      rec.onerror = (e) => { statusText.textContent = "Mic error: " + e.error; };
      rec.onend = () => { if (!handsFree) statusText.textContent = "Mic dabun bol kiva khali type kar"; };
    }

    function startMic() {
      if (!rec) {
        statusText.textContent = "Browser mic support nahi";
        return;
      }
      rec.lang = langSelect.value;
      try { rec.start(); } catch (_) {}
    }

    micBtn.onclick = startMic;

    async function askGemini(text) {
      const clean = (text || "").trim();
      if (!clean) return;
      const apiKey = localStorage.getItem(KEY_NAME);
      addMsg(clean, "user");
      promptInput.value = "";

      if (!apiKey) {
        addMsg("Adhi Setup madhun Gemini API key save kar.", "ai");
        openSetupBox();
        return;
      }

      statusText.textContent = "SARA vichar kartey...";
      const langName = { "mr-IN": "Marathi", "hi-IN": "Hindi", "en-IN": "English" }[langSelect.value] || "Marathi";
      const sys = const sys = tutor
        ? "You are SARA AI, a friendly English speaking coach for a Hindi/Marathi speaker. Reply in 2 to 3 short sentences max. Give a simple English sentence to repeat or practice, gently fix any English mistake, and end with one short question. Use simple English with a little " + langName + " only when needed."
        : "You are SARA AI, a helpful assistant. Reply in 2 to 3 short sentences max in " + langName + ".";
        ? "You are SARA AI, an English tutor. Reply clearly and gently correct mistakes in " + langName + "."
        : "You are SARA AI, a helpful assistant. Reply clearly and concisely in " + langName + ".";

      try {
        const res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=" + encodeURIComponent(apiKey),
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: sys }] },
              contents: [{ parts: [{ text: clean }] }]
            })
          }
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data?.error?.message || "API error");
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Reply milala nahi.";
        addMsg(reply, "ai");
        statusText.textContent = "Tayyar!";
        speak(reply);
      } catch (err) {
        addMsg("Error: " + err.message, "ai");
        statusText.textContent = "Error aala";
      }
    }

    chatForm.onsubmit = (e) => {
      e.preventDefault();
      askGemini(promptInput.value);
    };
  </script>
</body>
</html>
